name: ETF v3 校准

on:
  # 北京时间工作日 18:00（UTC 10:00），在每日行情分析完成后运行
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate-v3:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 v3 校准
        run: python calibrate_v3.py --sample-step 5
        env:
          TZ: Asia/Shanghai

      - name: 提交校准产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v3_calibration.json v3_acceptance_report.json
          if git diff --staged --quiet; then
            echo "没有新的校准结果"
          else
            git commit -m "更新 ETF v3 校准结果 $(date '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
