name: ETF V4 Calibration

on:
  schedule:
    # GitHub Actions cron is UTC. This is Wednesday 17:00 Asia/Shanghai.
    # The cadence gate below runs scheduled calibration on even ISO weeks.
    - cron: "0 13 * * 3"
  workflow_dispatch:

concurrency:
  group: etf-v4-producer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calibrate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check biweekly cadence
        id: cadence
        env:
          WEEK_PARITY: ${{ vars.V4_CALIBRATION_WEEK_PARITY || 'even' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_calibration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          week="$(TZ=Asia/Shanghai date +%V)"
          remainder=$((10#$week % 2))
          if { [ "$WEEK_PARITY" = "even" ] && [ "$remainder" -eq 0 ]; } || \
             { [ "$WEEK_PARITY" = "odd" ] && [ "$remainder" -eq 1 ]; }; then
            echo "run_calibration=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_calibration=false" >> "$GITHUB_OUTPUT"
            echo "Skipping calibration on ISO week $week; expected $WEEK_PARITY weeks."
          fi

      - uses: actions/checkout@v4
        if: steps.cadence.outputs.run_calibration == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.run_calibration == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.cadence.outputs.run_calibration == 'true'
        run: python -m pip install -r requirements.txt

      - name: Verify Gemini provider in isolation
        id: llm_health
        if: steps.cadence.outputs.run_calibration == 'true'
        continue-on-error: true
        run: python -m etf_radar.llm_provider_health --proposal-count 1
        env:
          TZ: Asia/Shanghai
          LLM_FACTOR_PROVIDER: "local"
          LLM_LOCAL_ENDPOINT: "https://ai.imlam.com/v1"
          LLM_LOCAL_MODEL: "gemini-3.5-flash"
          LLM_LOCAL_TIMEOUT_SECONDS: "60"

      - name: Run isolated walk-forward cycle and promote validated bundle
        if: steps.cadence.outputs.run_calibration == 'true'
        run: python run_cycle.py --force-calibration --sample-step 5
        env:
          TZ: Asia/Shanghai
          FORCE_DOWNLOAD: "true"
          REQUIRE_FRESH_MARKET_DATA: "true"
          LLM_FACTOR_PROPOSALS_ENABLED: "true"
          LLM_FACTOR_PROVIDER: "local"
          LLM_LOCAL_ENDPOINT: "https://ai.imlam.com/v1"
          LLM_LOCAL_MODEL: "gemini-3.5-flash"
          LLM_LOCAL_TIMEOUT_SECONDS: "60"
          LLM_FACTOR_PROPOSAL_COUNT: "2"
          LLM_FACTOR_PROPOSALS_REFRESH: ${{ steps.llm_health.outcome == 'success' && 'true' || 'false' }}

      - name: Run tests
        if: steps.cadence.outputs.run_calibration == 'true'
        run: python -m unittest discover -s tests -v

      - name: Commit calibration and analysis outputs
        if: steps.cadence.outputs.run_calibration == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/calibration public
          if ! git diff --staged --quiet; then
            git commit -m "Update ETF V4 calibration and analysis $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Assert calibration cycle health
        if: steps.cadence.outputs.run_calibration == 'true'
        run: python run_cycle.py --check-last-status
