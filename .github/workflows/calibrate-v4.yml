name: ETF V4 校准与仓库更新

on:
  schedule:
    - cron: '0 9 * * 1-5' # 北京时间工作日 17:00
  workflow_dispatch:

concurrency:
  group: etf-v4-analysis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calibrate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 恢复行情缓存
        uses: actions/cache@v4
        with:
          path: .runtime/data
          key: etf-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            etf-data-${{ runner.os }}-
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 下载行情并建立运行目录
        run: python main.py
        env:
          TZ: Asia/Shanghai
          FORCE_DOWNLOAD: 'true'
      - name: 执行 walk-forward 校准
        run: python calibrate_v4.py --sample-step 5
        env:
          TZ: Asia/Shanghai
      - name: 使用新校准重新生成 V4
        run: python main.py
        env:
          TZ: Asia/Shanghai
          FORCE_DOWNLOAD: 'false'
      - name: 运行测试
        run: python -m unittest discover -s tests -v
      - name: 提交校准与分析结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/calibration/v4_calibration.json artifacts/calibration/v4_acceptance_report.json public
          if ! git diff --staged --quiet; then
            git commit -m "更新 ETF V4 校准与分析结果 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
