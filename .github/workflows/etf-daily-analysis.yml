name: ETF V4 每日分析与仓库更新

on:
  schedule:
    - cron: '0 10 * * 1-5' # 北京时间工作日 18:00
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 强制刷新全部行情
        required: false
        default: false
        type: boolean

concurrency:
  group: etf-v4-analysis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 恢复行情缓存
        uses: actions/cache@v4
        with:
          path: .runtime/data
          key: etf-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            etf-data-${{ runner.os }}-
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 运行测试
        run: python -m unittest discover -s tests -v
      - name: 生成 V4 页面和信号
        run: python main.py
        env:
          TZ: Asia/Shanghai
          FORCE_DOWNLOAD: ${{ inputs.refresh_data && 'true' || 'false' }}
      - name: 提交每日分析结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public
          if ! git diff --staged --quiet; then
            git commit -m "更新 ETF V4 每日分析 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
