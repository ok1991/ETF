name: ETF V4 Daily Analysis

on:
  schedule:
    # GitHub Actions cron is UTC. This is 18:00 Asia/Shanghai every day.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: etf-v4-producer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run transactional production cycle
        run: python run_cycle.py
        env:
          TZ: Asia/Shanghai
          FORCE_DOWNLOAD: "true"
          REQUIRE_FRESH_MARKET_DATA: "true"
          LLM_FACTOR_PROPOSALS_ENABLED: "true"
          LLM_FACTOR_PROVIDER: "local"
          LLM_LOCAL_ENDPOINT: "https://ai.imlam.com/v1"
          LLM_LOCAL_MODEL: "gemini-3.5-flash"
          LLM_LOCAL_TIMEOUT_SECONDS: "60"
          LLM_FACTOR_PROPOSAL_COUNT: "2"

      - name: Commit daily analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/calibration public
          if ! git diff --staged --quiet; then
            git commit -m "Update ETF V4 daily analysis $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Assert calibration cycle health
        run: python run_cycle.py --check-last-status
