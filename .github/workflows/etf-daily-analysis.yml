name: ETF 每日分析报告（自动运行）

# 触发时机：
#   - 每天北京时间 17:00（收盘后2小时）自动运行
#   - 也可以手动点击 "Run workflow" 测试
on:
  schedule:
    - cron: '0 9 * * *'          # UTC 9:00 = 北京时间 17:00
  workflow_dispatch:

# 允许推送文件（index.html、ml_model.txt、数据库等）
permissions:
  contents: write

jobs:
  daily-etf-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 设置中国时区（Asia/Shanghai）
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "✅ 当前北京时间: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 【步骤1】训练 LightGBM 模型
        run: python train_ml_model.py
        env:
          TZ: Asia/Shanghai

      - name: 【步骤2】生成最新 ETF 分析报告（main.py）
        run: python main.py
        env:
          TZ: Asia/Shanghai

      - name: 提交并推送更新文件（index.html + ml_model.txt + 数据）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 只提交当天生成的核心文件（避免提交旧数据）
          git add index.html ml_model.txt etf_history.db etf_data/*.csv
          
          # 如果有实际变更才提交
          if git diff --staged --quiet; then
            echo "✅ 没有新变化，跳过提交"
          else
            git commit -m "📊 每日自动更新 ETF 分析报告 $(date '+%Y-%m-%d %H:%M:%S 北京时间')"
            git push
            echo "🚀 已成功推送最新报告！"
          fi
