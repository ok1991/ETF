name: ETF V4 每日分析与 Pages 发布

on:
  schedule:
    - cron: '0 9 * * 1-5' # 北京时间工作日 17:00
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 强制刷新全部行情
        required: false
        default: false
        type: boolean

concurrency:
  group: etf-v4-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 恢复行情缓存
        uses: actions/cache@v4
        with:
          path: .runtime/data
          key: etf-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            etf-data-${{ runner.os }}-
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 运行测试
        run: python -m unittest discover -s tests -v
      - name: 生成 V4 页面和信号
        run: python main.py
        env:
          TZ: Asia/Shanghai
          FORCE_DOWNLOAD: ${{ inputs.refresh_data && 'true' || 'false' }}
      - uses: actions/configure-pages@v5
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
