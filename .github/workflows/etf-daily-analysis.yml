name: ETF 每日分析报告（自动运行）
于:
  schedule:
    - cron: '0 9 * * 1-5'    # UTC 9:00 = 北京时间 17:00（每天运行 main.py）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-etf-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 设置中国时区（Asia/Shanghai）
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "✅ 当前北京时间: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 生成最新 ETF 分析报告（main.py 每天都跑）
        run: python main.py
        env:
          TZ: Asia/Shanghai

      - name: 提交并推送更新文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A                    # ←←← 同时处理 新增/修改/删除 文件
          
          if git diff --staged --quiet; then
            echo "✅ 没有新变化，跳过提交"
          else
            git commit -m "📊 每日自动更新 ETF 分析报告 $(date '+%Y-%m-%d %H:%M:%S 北京时间')"
            git push
            echo "🚀 已成功推送最新报告！"
          fi
