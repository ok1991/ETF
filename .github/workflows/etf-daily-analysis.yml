name: ETF V4 Daily Analysis

on:
  schedule:
    # GitHub Actions cron is UTC. This is 18:00 Asia/Shanghai every day.
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: etf-v4-producer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate V4 analysis with fresh market data
        run: python main.py
        env:
          TZ: Asia/Shanghai
          FORCE_DOWNLOAD: "true"

      - name: Commit daily analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public
          if ! git diff --staged --quiet; then
            git commit -m "Update ETF V4 daily analysis $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
