# ==================== ETF基金收市分析报告 配置中心 (V21.5 配置驱动版) ====================
# 所有评分阈值、周期、百分位、画像逻辑全部在此集中管理
# 修改任意参数后，直接运行 python test.py 即可生效（无需改代码）
# 建议：每次调优前先备份本文件

# ====================== 1. 基础技术指标周期参数 ======================
ma_very_short: 5                    # 超短期均线周期（MA5），用于判断多头排列（MA5>MA20>MA60）
ma_mid: 20                          # 中期均线（MA20），核心趋势线、BIAS、位置计算基准
ma_long: 60                         # 长期均线（MA60），多头排列与长期趋势判断
stat_period: 60                     # 动量统计周期（20日/60日涨幅、回撤计算窗口）
slope_period: 5                     # 斜率拟合窗口（最近5日MA/RS斜率计算）
history_days: 4                     # 5天历史路径
show_score_trend: true              # 是否显示分数趋势箭头（True/False）
price_change_up_threshold: 0.02     # 净波动日“上涨”阈值（攻击性判断）
price_change_down_threshold: -0.02  # 净波动日“下跌”阈值
benchmark_code: '510300'            # 基准指数ETF代码（沪深300），用于计算RS相对强度
rs_ma_period: 41                    # 相对强度RS的移动平均周期（经典41日）

# ====================== 2. 高级技术指标参数 (ATR/RSI/MACD) ======================
atr_period: 14                      # ATR(14) 波动率平滑周期（平滑度惩罚依据）
rsi_period: 14                      # RSI(14) 超买超卖周期
macd_fast: 12                       # MACD快线周期
macd_slow: 26                       # MACD慢线周期
macd_signal: 9                      # MACD信号线周期

# ====================== 3. 动态评分门槛 (V21.2) ======================
s_top_pct: 10                       # 正常市场S级门槛（真实分数前10%）
a_top_pct: 40                       # A级门槛（真实分数前40%）
weak_bear_s_top_pct: 8              # 弱熊/强熊市场S级自动收紧为前8%（更严格）

# ====================== 4. V21.4 全参数化决策阈值（核心可调区） ======================
# 4.1 排名百分位参数
top_rank_for_decay: 5               # 前N名龙头触发动能衰竭风控（防止高位假突破）
top15_pct: 0.15                     # 前15%视为“机构重仓”区
top20_pct: 0.20                     # 前20%（强力突破、洗盘、主线判断）
top40_pct: 0.40                     # 前40%（动能猛兽、稳健爬升者资格线）
wolf_rank_pct_threshold: 0.55       # 逆势孤狼：排名后45%仍高分时触发

# 4.2 _calculate_score 核心评分阈值
ma_slope_strong: 0.005              # MA斜率“极强”门槛（15分）
ma_slope_mid: 0.002                 # MA斜率“中等”门槛（10分）
rs_slope_strong: 0.004              # RS斜率“极强”门槛
rs_slope_mid: 0.0015                # RS斜率“中等”门槛
drawdown_strong: -0.05              # 最大回撤“优秀”门槛
drawdown_mid: -0.08                 # 最大回撤“良好”门槛
drawdown_weak: -0.12                # 最大回撤“及格”门槛
atr_punish_threshold: 0.025         # ATR% 过高惩罚线（>2.5%直接0分）
atr_strong: 0.012                   # ATR% “极平滑”门槛（10分）
atr_mid: 0.018                      # ATR% “中等平滑”门槛（7分）
bias_strong_low: 0                  # 健康乖离强区间下限
bias_strong_high: 4                 # 健康乖离强区间上限
bias_good_low: -2                   # 良好区间下限
bias_good_high: 6                   # 良好区间上限
bias_mid_low: -4                    # 中等区间下限
bias_mid_high: 8                    # 中等区间上限
below_ma_strong: 1                  # 支撑度“极强”（低于MA20天数≤1 → 15分）
below_ma_mid: 3                     # 支撑度“良好”（≤3 → 10分）
below_ma_weak: 5                    # 支撑度“及格”（≤5 → 5分）
net_vol_strong: 2                   # 攻击性“强”（净上涨日≥2 → 5分）
net_vol_mid: 1                      # 攻击性“中”（≥1 → 3分）
vol_ratio_divergence: 1.5           # 量价背离惩罚阈值（>1.5且RS下滑 → -10分）
rsi_weakbear_high: 80               # 弱熊市RSI超买极重罚线
rsi_weakbear_mid: 72                # 弱熊市RSI中度罚线
macd_penalty_strong: -1.0           # MACD衰竭重罚线
macd_penalty_mid: -0.5              # MACD衰竭中罚线
top_bonus_rank: 3                   # 龙头奖励（前3名额外+3分）

# 4.3 _get_final_assessment 画像决策阈值
risk_top_rank_decay_score: 48       # 龙头动能衰竭最低分线
top20_low_score: 55                 # 前20%最低合格分
strong_breakthrough_min_score: 70   # 强力突破最低分
beast_min_score: 75                 # 动能猛兽最低分
steady_climb_min_score: 57          # 稳健爬升者最低分
flag_min_score: 65                  # 高位旗形整理者最低分
wash_min_score: 58                  # 主线洗盘最低分
wolf_min_score: 65                  # 逆势孤狼最低分
top_warning_max_score: 68           # 筑顶高危最高分
rsi_overheat: 75                    # RSI过热预警线
rsi_decay: 68                       # RSI衰竭预警线
macd_decay: -0.001                  # MACD斜率衰竭线
ice_point_oversold_score: 45        # 冰点反转最低分
steady_ma_slope_min: 0.002          # 稳健爬升者MA斜率最低要求
steady_rsi_min: 62                  # 稳健爬升者RSI最低要求
steady_vol_max: 0.023               # 稳健爬升者20日波动率上限
fake_strong_ret60_min: 0.1          # 假强势60日涨幅最低要求
fake_strong_ret20_max: -0.02        # 假强势20日涨幅上限（转负）
breakthrough_daily_chg_min: -0.01   # 假突破日涨跌幅上限
ice_point_daily_chg_min: 0.015      # 冰点反转日涨幅最低要求
ice_point_vol_ratio_min: 1.3        # 冰点反转放量倍数最低要求
ice_point_bias_max: -7              # 冰点反转乖离最大值（极度超卖）

# 4.4 _get_volume_price_profile 量价特征阈值
vp_high_pos: 75                     # 高位区间（20日位置>75%）
vp_low_pos: 25                      # 低位区间（<25%）
vp_high_vol: 1.8                    # 高量倍数
vp_low_vol: 0.7                     # 低量倍数
vp_big_change: 0.02                 # 大涨/大跌日涨跌幅
vp_small_change: 0.01               # 小幅震荡日涨跌幅

# ====================== 5. 画像颜色映射（V20.3 保持不变） ======================
profile_to_color_map:
  主线共振突破: tag-red
  全能冠军: tag-gold
  强力突破者: tag-red
  动能猛兽: tag-red
  稳健爬升者: tag-green
  假强势预警: tag-orange
  高位旗形整理者: tag-blue
  弱市调整中: tag-grey
  潜力观察股: tag-purple
  冰点反转: tag-ice-blue
  筑顶高危: tag-orange
  假突破警报: tag-black
  逆势孤狼: tag-purple
  主线洗盘中: tag-blue
  动能衰竭预警: tag-orange

